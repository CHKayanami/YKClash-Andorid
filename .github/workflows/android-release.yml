name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version_name: ${{ steps.notes.outputs.version_name }}
      version_code: ${{ steps.notes.outputs.version_code }}
      prerelease: ${{ steps.notes.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate filtered release notes and version
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release-notes.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: dist/release-metadata/
          if-no-files-found: error
          retention-days: 14

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    uses: ./.github/workflows/android-build.yml
    with:
      build_type: release
      abis: ${{ matrix.abi }}
      version_name: ${{ needs.metadata.outputs.version_name }}
      version_code: ${{ needs.metadata.outputs.version_code }}
      artifact_name: release-apk-${{ matrix.abi }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: dist/metadata
      - uses: actions/download-artifact@v4
        with:
          pattern: release-apk-*
          path: dist/architectures
      - name: Collect APKs for both architectures
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          output = Path('dist/release')
          output.mkdir(parents=True, exist_ok=True)
          for abi in ['arm64-v8a', 'x86_64']:
              source = Path('dist/architectures') / ('release-apk-' + abi)
              metadata = json.loads((source / 'output-metadata.json').read_text())['elements']
              if len(metadata) != 1 or metadata[0]['versionName'] != os.environ['RELEASE_VERSION'] or metadata[0]['versionCode'] != int(os.environ['RELEASE_VERSION_CODE']):
                  raise SystemExit('Unexpected APK version for ' + abi)
              name = f"YKClash-{os.environ['RELEASE_VERSION']}-{abi}.apk"
              target = output / name
              shutil.copyfile(source / f'YKClash-release-{abi}.apk', target)
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "YKClash $RELEASE_TAG" --notes-file dist/metadata/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/release/*.apk --clobber
          gh release edit "$RELEASE_TAG" --title "YKClash $RELEASE_TAG" \
            --notes-file dist/metadata/release-notes.md --prerelease="$IS_PRERELEASE" --draft=false
